# This workflow will install Deno then run `deno lint` and `deno test`.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v6
      
      - uses: actions/cache@v5
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/package.json') }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x


      - name: Install deps
        # --no-lock: Deno seeds deno.lock from package-lock.json, and since
        # Deno 2.9.x that seeding produces an unreadable lock for this
        # dependency graph ("Could not find 'mime-types@2.1.35' in the list of
        # packages" — nested axios/node_modules/form-data resolving to the
        # hoisted top-level entry). Deno 2.0.3 handled it; regenerating
        # package-lock.json does NOT help. Skipping the lock avoids the seeding
        # step entirely. Node.js CI is the authoritative test workflow.
        run: deno install --no-lock
      
      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # TODO: enable fmt
      # - name: Verify formatting
      #   run: deno fmt --check

